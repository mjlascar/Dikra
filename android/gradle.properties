org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# Sin AndroidX: la app usa sólo lo que trae Android (Activity, WebView, un servicio).
android.useAndroidX=false
android.nonTransitiveRClass=true
# Nunca bajar un JDK por su cuenta: acá se compila con el 26 que ya está instalado.
org.gradle.java.installations.auto-download=false
# La app no tiene código Kotlin: sin la librería estándar el APK queda en unos cientos de KB.
kotlin.stdlib.default.dependency=false
